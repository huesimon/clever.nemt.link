<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clever.nemt.link – Lukket</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.7;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 3rem 0 2rem;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #111;
        }

        header p.subtitle {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            color: #666;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .card h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #111;
        }

        .card p {
            color: #444;
        }

        .screenshot-placeholder {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ddd;
            display: block;
            margin-top: 1rem;
        }

        .contact-links {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .contact-links li a {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .contact-links li a:hover {
            background-color: #333;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #999;
            padding: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>clever.nemt.link</h1>
            <p class="subtitle">Projektet er ikke længere aktivt</p>
        </header>

        <div class="card">
            <h2>Hvad skete der?</h2>
            <p>
                Dette projekt er ikke længere aktivt, da Clever bad mig om at lukke det ned.
                (Screenshot herunder)
            </p>
            <img
                src="images/ciso-screenshot.png"
                alt="Skærmbillede af besked fra Clevers CISO"
                class="screenshot-placeholder"
            />
        </div>

        <div class="card">
            <h2>Kontakt</h2>
            <ul class="contact-links">
                <!-- Tilføj dine kontaktlinks herunder -->
                <li><a href="https://github.com/huesimon" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            </ul>
        </div>

        <footer>
            <p>clever.nemt.link – Et lukket projekt</p>
        </footer>
    </div>
</body>
</html>
